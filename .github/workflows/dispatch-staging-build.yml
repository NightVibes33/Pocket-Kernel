name: Dispatch PocketKernel Staging Build

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the manual PocketKernel build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-unsigned.yml/dispatches" \
            -f ref='pocketkernel-1.0-full-rebuild' \
            -F 'inputs[publish_release]=false'
