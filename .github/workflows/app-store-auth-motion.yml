name: Apply Cinematic Auth and Motion

on:
  push:
    branches: [main]
    paths: [.bootstrap/auth-motion-trigger]

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/app-store-ready
          fetch-depth: 0

      - name: Verify and unpack product bundle
        run: |
          set -euo pipefail
          base64 -D .bootstrap/auth-motion.bundle > /tmp/auth-motion.tar.gz
          echo '511da009471716c3a3dd0dc9541ad3f3004ede355591f3ddfe1ccebe077d3a61  /tmp/auth-motion.tar.gz' | shasum -a 256 -c -
          rm -rf /tmp/auth-motion
          mkdir -p /tmp/auth-motion
          tar -xzf /tmp/auth-motion.tar.gz -C /tmp/auth-motion

      - name: Install identity, boot, and motion experience
        run: |
          set -euo pipefail
          root=/tmp/auth-motion
          cp "$root/PocketKernel/App/EntryExperience.swift" PocketKernel/App/EntryExperience.swift
          cp "$root/PocketKernel/App/PocketKernelApp.swift" PocketKernel/App/PocketKernelApp.swift
          cp "$root/PocketKernel/PocketKernel.entitlements" PocketKernel/PocketKernel.entitlements
          cp "$root/PocketKernel/Info.plist" PocketKernel/Info.plist
          cp "$root/lib/account-auth.js" lib/account-auth.js
          mkdir -p api/auth/google api/auth/email
          cp "$root/api/auth/apple.js" api/auth/apple.js
          cp "$root/api/auth/exchange.js" api/auth/exchange.js
          cp "$root/api/auth/session.js" api/auth/session.js
          cp "$root/api/auth/google/start.js" api/auth/google/start.js
          cp "$root/api/auth/google/callback.js" api/auth/google/callback.js
          cp "$root/api/auth/email/start.js" api/auth/email/start.js
          cp "$root/api/auth/email/verify.js" api/auth/email/verify.js
          cp "$root/DESIGN_SYSTEM_PROMPT.md" DESIGN_SYSTEM_PROMPT.md

      - name: Add launch color assets
        run: |
          set -euo pipefail
          mkdir -p PocketKernel/Assets.xcassets/LaunchBackground.colorset
          cat > PocketKernel/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > PocketKernel/Assets.xcassets/LaunchBackground.colorset/Contents.json <<'JSON'
          {"colors":[{"color":{"color-space":"srgb","components":{"alpha":"1.000","blue":"0.070","green":"0.030","red":"0.025"}},"idiom":"universal"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Register source, assets, entitlement, and official Google button
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PocketKernel.xcodeproj/project.pbxproj')
          s = p.read_text()

          def once(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          once(
              '\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000112 /* PrivacyInfo.xcprivacy */; };',
              '\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000112 /* PrivacyInfo.xcprivacy */; };\n\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */ = {isa = PBXBuildFile; fileRef = B20000000000000000000100 /* EntryExperience.swift */; };\n\t\tB20000000000000000000103 /* GoogleSignInSwift in Frameworks */ = {isa = PBXBuildFile; productRef = B20000000000000000000102 /* GoogleSignInSwift */; };\n\t\tB20000000000000000000105 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = B20000000000000000000104 /* Assets.xcassets */; };',
              'build files'
          )
          once(
              '\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */ = {isa = PBXFileReference; lastKnownFileType = text.xml; path = PrivacyInfo.xcprivacy; sourceTree = "<group>"; };',
              '\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */ = {isa = PBXFileReference; lastKnownFileType = text.xml; path = PrivacyInfo.xcprivacy; sourceTree = "<group>"; };\n\t\tB20000000000000000000100 /* EntryExperience.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App/EntryExperience.swift; sourceTree = "<group>"; };\n\t\tB20000000000000000000104 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };',
              'file references'
          )
          once(
              '\t\t\tfiles = ();',
              '\t\t\tfiles = (\n\t\t\t\tB20000000000000000000103 /* GoogleSignInSwift in Frameworks */,\n\t\t\t);',
              'framework phase'
          )
          once(
              '\t\t\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */,',
              '\t\t\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */,\n\t\t\t\tB20000000000000000000100 /* EntryExperience.swift */,\n\t\t\t\tB20000000000000000000104 /* Assets.xcassets */,',
              'source group'
          )
          once(
              '\t\t\tpackageProductDependencies = ();',
              '\t\t\tpackageProductDependencies = (\n\t\t\t\tB20000000000000000000102 /* GoogleSignInSwift */,\n\t\t\t);',
              'target packages'
          )
          once(
              '\t\t\tproductRefGroup = A10000000000000000000007 /* Products */;',
              '\t\t\tproductRefGroup = A10000000000000000000007 /* Products */;\n\t\t\tpackageReferences = (\n\t\t\t\tB20000000000000000000106 /* XCRemoteSwiftPackageReference GoogleSignIn-iOS */,\n\t\t\t);',
              'project packages'
          )
          once(
              '\t\t\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */,',
              '\t\t\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */,\n\t\t\t\tB20000000000000000000105 /* Assets.xcassets in Resources */,',
              'resources'
          )
          once(
              '\t\t\t\tA10000000000000000000111 /* PocketKernelApp.swift in Sources */,',
              '\t\t\t\tA10000000000000000000111 /* PocketKernelApp.swift in Sources */,\n\t\t\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */,',
              'sources'
          )

          package_sections = '''\n/* Begin XCRemoteSwiftPackageReference section */
\t\tB20000000000000000000106 /* XCRemoteSwiftPackageReference GoogleSignIn-iOS */ = {
\t\t\tisa = XCRemoteSwiftPackageReference;
\t\t\trepositoryURL = "https://github.com/google/GoogleSignIn-iOS";
\t\t\trequirement = {
\t\t\t\tkind = upToNextMajorVersion;
\t\t\t\tminimumVersion = 9.1.0;
\t\t\t};
\t\t};
/* End XCRemoteSwiftPackageReference section */

/* Begin XCSwiftPackageProductDependency section */
\t\tB20000000000000000000102 /* GoogleSignInSwift */ = {
\t\t\tisa = XCSwiftPackageProductDependency;
\t\t\tpackage = B20000000000000000000106 /* XCRemoteSwiftPackageReference GoogleSignIn-iOS */;
\t\t\tproductName = GoogleSignInSwift;
\t\t};
/* End XCSwiftPackageProductDependency section */
'''
          if 'Begin XCRemoteSwiftPackageReference section' not in s:
              s = s.replace('/* Begin XCBuildConfiguration section */', package_sections + '\n/* Begin XCBuildConfiguration section */', 1)

          s = s.replace('CURRENT_PROJECT_VERSION = 2;', 'CURRENT_PROJECT_VERSION = 3;')
          s = s.replace('MARKETING_VERSION = 2.1.0;', 'MARKETING_VERSION = 2.2.0;')
          s = s.replace('\t\t\t\tCODE_SIGN_STYLE = Automatic;', '\t\t\t\tCODE_SIGN_ENTITLEMENTS = PocketKernel/PocketKernel.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;')
          p.write_text(s)
          PY
          grep -q 'EntryExperience.swift in Sources' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'GoogleSignInSwift in Frameworks' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = PocketKernel/PocketKernel.entitlements' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.2.0' PocketKernel.xcodeproj/project.pbxproj

      - name: Connect account controls to profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PocketKernel/UI/Views.swift')
          s = p.read_text()
          anchor = '    @EnvironmentObject private var oauth: OAuthCoordinator\n    @AppStorage("didCompleteOnboarding.v2")'
          replacement = '    @EnvironmentObject private var oauth: OAuthCoordinator\n    @EnvironmentObject private var account: AccountController\n    @AppStorage("didCompleteOnboarding.v2")'
          if replacement not in s:
              if anchor not in s: raise SystemExit('profile environment anchor missing')
              s = s.replace(anchor, replacement, 1)

          account_section = '''
                Section("Account") {
                    if let profile = account.profile {
                        LabeledContent("Signed in as", value: profile.displayName)
                        if let email = profile.email, !email.isEmpty {
                            LabeledContent("Email", value: email)
                        }
                        LabeledContent("Method", value: profile.provider.capitalized)
                    }
                    Button("Sign out", systemImage: "rectangle.portrait.and.arrow.right") {
                        account.signOut()
                    }
                }

'''
          privacy_anchor = '                Section("Privacy and control") {'
          if account_section not in s:
              if privacy_anchor not in s: raise SystemExit('privacy section anchor missing')
              s = s.replace(privacy_anchor, account_section + privacy_anchor, 1)

          deletion_anchor = '            try await BackendClient.shared.deleteAccount()\n            chat.clearAllLocalData()'
          deletion_replacement = '            try await BackendClient.shared.deleteAccount()\n            account.finishDeletion()\n            chat.clearAllLocalData()'
          if deletion_replacement not in s:
              if deletion_anchor not in s: raise SystemExit('delete anchor missing')
              s = s.replace(deletion_anchor, deletion_replacement, 1)
          p.write_text(s)
          PY

      - name: Make account deletion complete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/account/delete.js')
          s = p.read_text()
          anchor = '    await deleteKey(`pk:automations:${user.id}`);\n\n    json(res, 200, { deleted: true });'
          replacement = '    await deleteKey(`pk:automations:${user.id}`);\n    await deleteKey(`pk:account:${user.id}`);\n\n    json(res, 200, { deleted: true });'
          if replacement not in s:
              if anchor not in s: raise SystemExit('account deletion anchor missing')
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY

      - name: Validate product integration
        run: |
          set -euo pipefail
          plutil -lint PocketKernel/Info.plist PocketKernel/PocketKernel.entitlements PocketKernel/PrivacyInfo.xcprivacy
          swiftc -parse PocketKernel/App/EntryExperience.swift PocketKernel/App/PocketKernelApp.swift PocketKernel/UI/Views.swift
          for file in lib/account-auth.js api/auth/apple.js api/auth/exchange.js api/auth/session.js api/auth/google/start.js api/auth/google/callback.js api/auth/email/start.js api/auth/email/verify.js api/account/delete.js; do node --check "$file"; done
          npm test
          node Scripts/validate_backend.mjs
          grep -q 'GoogleSignInButton' PocketKernel/App/EntryExperience.swift
          grep -q 'SignInWithAppleButton' PocketKernel/App/EntryExperience.swift
          grep -q 'pocketkernel-auth' PocketKernel/Info.plist
          grep -q 'pk:account' api/account/delete.js

      - name: Commit clean product upgrade
        run: |
          set -euo pipefail
          rm -f .bootstrap/auth-motion.bundle
          git config user.name 'PocketKernel Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add cinematic launch and production account gateway'
          git push origin HEAD:product/app-store-ready
