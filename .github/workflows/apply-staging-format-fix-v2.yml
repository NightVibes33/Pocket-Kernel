name: Apply staging format fix v2

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Normalize migration helper indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernel/Persistence/PocketStore.swift')
          lines = path.read_text().splitlines()
          start = lines.index('    private static func migrate(_ database: OpaquePointer?) throws {')
          expected = [
              '        func raw(_ sql: String) throws {',
              '            guard sqlite3_exec(database, sql, nil, nil, nil) == SQLITE_OK else {',
              '                let message = database.map { String(cString: sqlite3_errmsg($0)) } ?? "Unknown SQLite migration error"',
              '                throw StoreError.query(message)',
              '            }',
              '        }',
              '',
          ]
          lines[start + 1:start + 8] = expected
          path.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/apply-staging-format-fix-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Persistence/PocketStore.swift .github/workflows/apply-staging-format-fix-v2.yml
          git commit -m 'Normalize database bootstrap formatting'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
