name: Apply Nova Secondary UI
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'product/app-store-ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Register secondary UI and switch tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('PocketKernel.xcodeproj/project.pbxproj')
          text = project.read_text()
          edits = [
              (
                  '\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */ = {isa = PBXBuildFile; fileRef = B20000000000000000000100 /* EntryExperience.swift */; };',
                  '\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */ = {isa = PBXBuildFile; fileRef = B20000000000000000000100 /* EntryExperience.swift */; };\n\t\tC30000000000000000000101 /* NovaSecondaryViews.swift in Sources */ = {isa = PBXBuildFile; fileRef = C30000000000000000000100 /* NovaSecondaryViews.swift */; };'
              ),
              (
                  '\t\tB20000000000000000000100 /* EntryExperience.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App/EntryExperience.swift; sourceTree = "<group>"; };',
                  '\t\tB20000000000000000000100 /* EntryExperience.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App/EntryExperience.swift; sourceTree = "<group>"; };\n\t\tC30000000000000000000100 /* NovaSecondaryViews.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = UI/NovaSecondaryViews.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\t\t\tB20000000000000000000100 /* EntryExperience.swift */,\n\t\t\t\tB20000000000000000000104 /* Assets.xcassets */,',
                  '\t\t\t\tB20000000000000000000100 /* EntryExperience.swift */,\n\t\t\t\tC30000000000000000000100 /* NovaSecondaryViews.swift */,\n\t\t\t\tB20000000000000000000104 /* Assets.xcassets */,'
              ),
              (
                  '\t\t\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */,',
                  '\t\t\t\tB20000000000000000000101 /* EntryExperience.swift in Sources */,\n\t\t\t\tC30000000000000000000101 /* NovaSecondaryViews.swift in Sources */,'
              ),
          ]
          for old, new in edits:
              if old not in text:
                  raise SystemExit(f'missing project marker: {old}')
              text = text.replace(old, new, 1)
          project.write_text(text)

          app = Path('PocketKernel/App/PocketKernelApp.swift')
          text = app.read_text()
          replacements = {
              'AutomationsView { selected = .home }': 'NovaAutomationsView { selected = .home }',
              'ActivityView()': 'NovaActivityView()',
              'ProfileView { didCompleteOnboarding = false }': 'NovaProfileView { didCompleteOnboarding = false }',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing app marker: {old}')
              text = text.replace(old, new, 1)
          app.write_text(text)

          Path('.github/workflows/apply-nova-secondary.yml').unlink()
          PY
          git config user.name "PocketKernel Build Bot"
          git config user.email "actions@github.com"
          git add PocketKernel.xcodeproj/project.pbxproj PocketKernel/App/PocketKernelApp.swift .github/workflows/apply-nova-secondary.yml
          git commit -m "feat: activate redesigned secondary screens"
          git push origin HEAD:${{ github.head_ref }}
