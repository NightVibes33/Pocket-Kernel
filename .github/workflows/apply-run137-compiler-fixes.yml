name: Apply Run 137 Shell Fix

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Simplify the permission dialog expression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('PocketKernel/Shell/RootTabView.swift')
          source = root.read_text()
          property_anchor = '''    private var screen: ScreenSpec? { manifest.screens.first { $0.id == selectedScreenID } ?? manifest.screens.first }
    private var collectionSpecs: [String: CollectionSpec] { Dictionary(uniqueKeysWithValues: manifest.collections.map { ($0.id, $0) }) }
'''
          property_replacement = '''    private var screen: ScreenSpec? { manifest.screens.first { $0.id == selectedScreenID } ?? manifest.screens.first }
    private var collectionSpecs: [String: CollectionSpec] { Dictionary(uniqueKeysWithValues: manifest.collections.map { ($0.id, $0) }) }
    private var permissionDialogTitle: String {
        guard let request = permissionRequest else { return "Permission" }
        return "\(request.appName) requests \(request.capability.displayName)"
    }
    private var permissionDialogPresented: Binding<Bool> {
        Binding(
            get: { permissionRequest != nil },
            set: { presented in if !presented { permissionRequest = nil } }
        )
    }
'''
          if 'private var permissionDialogTitle:' not in source:
              if property_anchor not in source:
                  raise SystemExit('Missing RuntimeView property anchor')
              source = source.replace(property_anchor, property_replacement, 1)

          dialog = '''        .confirmationDialog(
            permissionRequest.map { "\($0.appName) requests \($0.capability.displayName)" } ?? "Permission",
            isPresented: Binding(get: { permissionRequest != nil }, set: { if !$0 { permissionRequest = nil } }),
            titleVisibility: .visible
        ) { permissionButtons } message: { Text(permissionRequest?.reason ?? "") }
'''
          simpler_dialog = '''        .confirmationDialog(
            permissionDialogTitle,
            isPresented: permissionDialogPresented,
            titleVisibility: .visible
        ) { permissionButtons } message: { Text(permissionRequest?.reason ?? "") }
'''
          if dialog in source:
              source = source.replace(dialog, simpler_dialog, 1)
          elif 'isPresented: permissionDialogPresented' not in source:
              raise SystemExit('Missing permission dialog expression')

          root.write_text(source)
          PY

          rm .github/workflows/apply-run137-compiler-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Shell/RootTabView.swift .github/workflows/apply-run137-compiler-fixes.yml
          git commit -m 'Simplify RuntimeView permission dialog for Swift 6'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
