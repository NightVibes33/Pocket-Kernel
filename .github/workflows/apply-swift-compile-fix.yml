name: Apply Swift compile fix

on:
  push:
    branches:
      - product/app-store-ready

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/app-store-ready
          fetch-depth: 0

      - name: Patch compiler errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path} but found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          views = Path("PocketKernel/UI/Views.swift")
          replace_once(
              views,
              "struct ProfileView: View {\n    @EnvironmentObject private var chat: ChatController\n    @EnvironmentObject private var oauth: OAuthCoordinator\n",
              "struct ProfileView: View {\n    @EnvironmentObject private var chat: ChatController\n    @EnvironmentObject private var oauth: OAuthCoordinator\n    @EnvironmentObject private var account: AccountController\n",
          )

          entry = Path("PocketKernel/App/EntryExperience.swift")
          replacements = [
              (
                  "Task { await signInWithApple(token: token, nonce: nonce, name: name, email: credential.email) }",
                  "Task { await self.signInWithApple(token: token, nonce: nonce, name: name, email: credential.email) }",
              ),
              (
                  "let ticket = try await openAuthenticationSession(url: url)\n            profile = try await AccountAPI.shared.exchangeGoogleTicket(ticket)",
                  "let ticket = try await self.openAuthenticationSession(url: url)\n            self.profile = try await AccountAPI.shared.exchangeGoogleTicket(ticket)",
              ),
              (
                  "_ = try await AccountAPI.shared.startEmail(normalized)\n            emailAwaitingCode = normalized",
                  "_ = try await AccountAPI.shared.startEmail(normalized)\n            self.emailAwaitingCode = normalized",
              ),
              (
                  "profile = try await AccountAPI.shared.verifyEmail(email, code: normalizedCode)\n            emailAwaitingCode = nil",
                  "self.profile = try await AccountAPI.shared.verifyEmail(email, code: normalizedCode)\n            self.emailAwaitingCode = nil",
              ),
              (
                  "profile = try await AccountAPI.shared.signInWithApple(identityToken: token, nonce: nonce, name: name, email: email)",
                  "self.profile = try await AccountAPI.shared.signInWithApple(identityToken: token, nonce: nonce, name: name, email: email)",
              ),
          ]
          for old, new in replacements:
              replace_once(entry, old, new)
          PY

          rm .github/workflows/apply-swift-compile-fix.yml

          git config user.name "PocketKernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add PocketKernel/UI/Views.swift PocketKernel/App/EntryExperience.swift .github/workflows/apply-swift-compile-fix.yml
          git diff --cached --check
          git commit -m "fix: resolve Swift 6 account compile errors"
          git push origin HEAD:product/app-store-ready
