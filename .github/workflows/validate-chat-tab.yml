name: Validate dedicated Chat tab

on:
  push:
    branches:
      - product/app-store-ready

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[chat-build]') }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      OUTPUT_DIR: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/app-store-ready
          fetch-depth: 0

      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          bash Scripts/materialize_app_icon.sh
          node Scripts/validate_backend.mjs
          npm test
          rm -rf build output
          mkdir -p output
          set -o pipefail
          xcodebuild clean build \
            -project PocketKernel.xcodeproj \
            -scheme PocketKernel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild.log"

      - name: Package and validate
        shell: bash
        run: |
          set -euo pipefail
          Scripts/build_unsigned_ipa.sh "$DERIVED_DATA/Build/Products/Release-iphoneos/PocketKernel.app" "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          Scripts/validate_ipa.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          (cd "$OUTPUT_DIR" && shasum -a 256 PocketKernel-unsigned.ipa > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: PocketKernel-chat-tab-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-chat-tab.yml
          git config user.name Zyn
          git config user.email bobbytatum999@gmail.com
          git add -A
          git commit -m 'ci: remove temporary Chat build workflow [chat-build]'
          git push origin HEAD:product/app-store-ready
