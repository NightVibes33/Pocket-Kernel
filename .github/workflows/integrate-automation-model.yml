name: Integrate Automation Model
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integrate-automation-model.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'pocketkernel-1.0-full-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Integrate automation model, shell fixes, and tests
        shell: python
        run: |
          from pathlib import Path

          root = Path('PocketKernel/Shell/RootTabView.swift')
          text = root.read_text()
          text = text.replace(
              'private func triggerDescription(_ trigger: PKTrigger) -> String {\n    switch trigger.kind {',
              'private func triggerDescription(_ trigger: PKTrigger) -> String {\n    return switch trigger.kind {'
          )
          text = text.replace(
              '                    Button {\n                        workspace.compilePrompt()\n                        showingDraft = workspace.draft != nil\n                    } label: {',
              '                    Button {\n                        Task {\n                            await workspace.compilePrompt()\n                            showingDraft = workspace.draft != nil\n                        }\n                    } label: {'
          )
          text = text.replace(
              '                    .disabled(workspace.prompt.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty)',
              '                    .disabled(workspace.isWorking || workspace.prompt.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty)'
          )
          text = text.replace(
              '        let arguments = ProcessInfo.processInfo.arguments\n        let requested = Self.argumentValue("-PKStartTab", arguments: arguments)',
              '        let arguments = ProcessInfo.processInfo.arguments\n        if arguments.contains("-PKResetOnboarding") {\n            UserDefaults.standard.removeObject(forKey: "PKAutomationOnboardingComplete")\n        }\n        let requested = Self.argumentValue("-PKStartTab", arguments: arguments)'
          )
          root.write_text(text)

          core = Path('PocketKernel/Runtime/AutomationCore.swift')
          text = core.read_text()
          text = text.replace(
              '    private let compiler = PKAutomationCompiler()\n    private let validator = PKAutomationValidator()',
              '    private let compiler = PKAutomationCompiler()\n    private let foundationGenerator = PKFoundationAutomationGenerator()\n    private let validator = PKAutomationValidator()'
          )
          text = text.replace(
              '        storageURL = directory.appending(path: "workspace.json")\n        load()',
              '        storageURL = directory.appending(path: "workspace.json")\n        if ProcessInfo.processInfo.arguments.contains("-PKResetDatabase") {\n            try? FileManager.default.removeItem(at: storageURL)\n        }\n        load()'
          )
          old = '''    func compilePrompt() {
        do {
            let result = try compiler.compile(prompt)
            draft = result
            validationIssues = validator.validate(result)
            errorMessage = nil
        } catch {
            errorMessage = error.localizedDescription
        }
    }
'''
          new = '''    func compilePrompt() async {
        isWorking = true
        defer { isWorking = false }
        do {
            let result: PKAutomation
            if modelMode == "mock" || modelMode == "local" {
                result = try compiler.compile(prompt)
            } else {
                do {
                    result = try await foundationGenerator.generate(prompt)
                } catch {
                    result = try compiler.compile(prompt)
                }
            }
            draft = result
            validationIssues = validator.validate(result)
            errorMessage = nil
        } catch {
            errorMessage = error.localizedDescription
        }
    }

    private var modelMode: String? {
        let arguments = ProcessInfo.processInfo.arguments
        guard let index = arguments.firstIndex(of: "-PKModelMode"), arguments.indices.contains(index + 1) else { return nil }
        return arguments[index + 1].lowercased()
    }
'''
          if old not in text:
              raise SystemExit('compilePrompt block not found')
          text = text.replace(old, new)
          core.write_text(text)

          project = Path('PocketKernel.xcodeproj/project.pbxproj')
          text = project.read_text()
          build = 'B10000000000000000000026 /* FoundationAutomationGenerator.swift in Sources */ = {isa = PBXBuildFile; fileRef = F10000000000000000000031; };'
          ref = 'F10000000000000000000031 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = FoundationAutomationGenerator.swift; sourceTree = "<group>"; };'
          if build not in text:
              text = text.replace('/* End PBXBuildFile section */', '\t\t' + build + '\n/* End PBXBuildFile section */')
          if ref not in text:
              text = text.replace('/* End PBXFileReference section */', '\t\t' + ref + '\n/* End PBXFileReference section */')
          text = text.replace(
              'G10000000000000000000013 = {isa = PBXGroup; path = Builder; sourceTree = "<group>"; children = (F10000000000000000000004,F10000000000000000000005,); };',
              'G10000000000000000000013 = {isa = PBXGroup; path = Builder; sourceTree = "<group>"; children = (F10000000000000000000004,F10000000000000000000005,F10000000000000000000031,); };'
          )
          text = text.replace(
              'B10000000000000000000022,B10000000000000000000025,); runOnlyForDeploymentPostprocessing = 0; };',
              'B10000000000000000000022,B10000000000000000000025,B10000000000000000000026,); runOnlyForDeploymentPostprocessing = 0; };'
          )
          project.write_text(text)

          ui = Path('PocketKernelUITests/PocketKernelUITests.swift')
          ui.write_text(r'''import XCTest

@MainActor
final class PocketKernelUITests: XCTestCase {
    func testOnboardingExplainsAutomationProduct() {
        let app = launch(uiTesting: false, reset: true, resetOnboarding: true)
        XCTAssertTrue(app.staticTexts["PocketKernel"].waitForExistence(timeout: 12))
        XCTAssertTrue(app.staticTexts["Describe work in plain English. PocketKernel builds a typed automation, shows every step, asks before acting, and runs the approved workflow predictably."].exists)
        tap(app.buttons["Get Started"])
        XCTAssertTrue(app.buttons["Describe an automation"].waitForExistence(timeout: 8))
    }

    func testBuildReviewSaveAndPersistTypedWorkflow() {
        let prompt = "Every weekday at 8 AM, summarize unread customer emails and post the digest to Slack"
        let app = launch(startTab: "create", reset: true)
        let editor = app.textViews["Automation description"]
        tap(editor, timeout: 10)
        editor.typeText(prompt)
        tap(app.buttons["Build workflow"], timeout: 8)

        XCTAssertTrue(app.navigationBars["Review"].waitForExistence(timeout: 15))
        XCTAssertTrue(app.staticTexts["Workflow"].exists)
        XCTAssertTrue(app.staticTexts["Gmail · searchMessages"].exists)
        XCTAssertTrue(app.staticTexts["Apple Intelligence · summarize"].exists)
        XCTAssertTrue(app.staticTexts["Slack · postMessage"].exists)
        XCTAssertTrue(app.staticTexts["Approval required"].exists)
        tap(app.buttons["Save automation"], timeout: 8)

        tap(app.tabBars.buttons["Automations"], timeout: 8)
        XCTAssertTrue(app.staticTexts[prompt].waitForExistence(timeout: 10))

        app.terminate()
        let relaunched = launch(startTab: "automations")
        XCTAssertTrue(relaunched.staticTexts[prompt].waitForExistence(timeout: 10))
    }

    func testOAuthConnectionIsNeverFaked() {
        let app = launch(startTab: "connections", reset: true)
        tap(app.buttons["Gmail"], timeout: 10)
        XCTAssertTrue(app.staticTexts["OAuth service not configured"].waitForExistence(timeout: 8))
        let connect = app.buttons["Connect Gmail"]
        XCTAssertTrue(connect.exists)
        XCTAssertFalse(connect.isEnabled)
    }

    private func launch(
        startTab: String? = nil,
        uiTesting: Bool = true,
        reset: Bool = false,
        resetOnboarding: Bool = false
    ) -> XCUIApplication {
        let app = XCUIApplication()
        app.launchArguments = ["-PKModelMode", "mock", "-PKDisableAnimations", "1"]
        if uiTesting { app.launchArguments += ["-PKUITesting", "1"] }
        if let startTab { app.launchArguments += ["-PKStartTab", startTab] }
        if reset { app.launchArguments += ["-PKResetDatabase", "1"] }
        if resetOnboarding { app.launchArguments += ["-PKResetOnboarding", "1"] }
        app.launch()
        return app
    }

    private func tap(_ element: XCUIElement, timeout: TimeInterval = 5) {
        XCTAssertTrue(element.waitForExistence(timeout: timeout), "Missing element: \(element)")
        XCTAssertTrue(element.isHittable, "Element is not hittable: \(element)")
        element.tap()
    }
}
''')

          tests = Path('PocketKernelTests/PocketKernelTests.swift')
          text = tests.read_text()
          marker = 'final class AutomationPlatformTests: XCTestCase'
          if marker not in text:
              text += r'''

final class AutomationPlatformTests: XCTestCase {
    func testCompilerCreatesDifferentRegisteredWorkflows() throws {
        let compiler = PKAutomationCompiler()
        let digest = try compiler.compile("Every weekday at 8 AM, summarize unread customer emails and post the digest to Slack")
        let alert = try compiler.compile("Monitor https://api.example.org/price and alert me when the price drops below 20")

        XCTAssertEqual(digest.trigger.kind, .schedule)
        XCTAssertEqual(digest.trigger.configuration["time"], "08:00")
        XCTAssertTrue(digest.steps.contains { $0.service == .gmail && $0.operation == "searchMessages" })
        XCTAssertTrue(digest.steps.contains { $0.service == .intelligence && $0.operation == "summarize" })
        XCTAssertTrue(digest.steps.contains { $0.service == .slack && $0.operation == "postMessage" })
        XCTAssertEqual(alert.trigger.kind, .webCondition)
        XCTAssertTrue(alert.steps.contains { $0.service == .http && $0.operation == "getJSON" })
        XCTAssertNotEqual(digest.steps.map(\.operation), alert.steps.map(\.operation))
        XCTAssertFalse(PKAutomationValidator().validate(digest).contains { $0.severity == .error })
        XCTAssertFalse(PKAutomationValidator().validate(alert).contains { $0.severity == .error })
    }

    func testExternalMutationsAlwaysRequireApproval() throws {
        let automation = try PKAutomationCompiler().compile("When an urgent Gmail arrives, draft a reply and notify me")
        let mutations = automation.steps.filter(\.mutatesExternalState)
        XCTAssertFalse(mutations.isEmpty)
        XCTAssertTrue(mutations.allSatisfy { $0.approval == .externalMutation })
    }

    func testValidatorRejectsUnknownOperationsAndUnapprovedMutations() throws {
        var automation = try PKAutomationCompiler().compile("Post a digest to Slack")
        automation.steps[0].operation = "inventedOperation"
        XCTAssertTrue(PKAutomationValidator().validate(automation).contains { $0.code == "operation.unsupported" })

        automation = try PKAutomationCompiler().compile("Notify me with the result")
        let mutationIndex = try XCTUnwrap(automation.steps.firstIndex(where: \.mutatesExternalState))
        automation.steps[mutationIndex].approval = .none
        XCTAssertTrue(PKAutomationValidator().validate(automation).contains { $0.code == "approval.required" })
    }

    func testDeterministicExecutorStopsForApproval() async throws {
        let automation = try PKAutomationCompiler().compile("Notify me with a daily summary")
        let executor = PKDeterministicExecutor()
        let waiting = await executor.execute(automation, approved: false)
        XCTAssertEqual(waiting.state, .waitingForApproval)
        let approved = await executor.execute(automation, approved: true)
        XCTAssertEqual(approved.state, .succeeded)
    }
}
'''
              tests.write_text(text)
      - name: Format, verify, and commit
        run: |
          set -euo pipefail
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --config .swiftformat
          grep -q 'FoundationAutomationGenerator.swift in Sources' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'return switch trigger.kind' PocketKernel/Shell/RootTabView.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PocketKernel PocketKernelTests PocketKernelUITests PocketKernel.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m 'Integrate Foundation automation generation and product tests'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
