name: Run Automation Integration
on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]
    paths:
      - '.github/workflows/run-automation-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Execute integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/integrate-automation-model.yml').read_text()
          start = workflow.index('        shell: python\n        run: |\n') + len('        shell: python\n        run: |\n')
          end = workflow.index('\n      - name: Format, verify, and commit', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'integrate-automation-model', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --config .swiftformat
          grep -q 'FoundationAutomationGenerator.swift in Sources' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'return switch trigger.kind' PocketKernel/Shell/RootTabView.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PocketKernel PocketKernelTests PocketKernelUITests PocketKernel.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m 'Integrate Foundation automation generation and product tests'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
