name: Apply Final Verified UI Fix

on:
  push:
    branches:
      - pocketkernel-1.0-full-rebuild
    paths:
      - .github/workflows/zz-apply-final-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0

      - name: Patch runtime form presentation and UI synchronization
        shell: python
        run: |
          from pathlib import Path

          root_path = Path("PocketKernel/Shell/RootTabView.swift")
          root = root_path.read_text()
          old = '''        .fullScreenCover(item: $editingCollection) { collection in
              recordForm(collection)
          }
'''
          new = '''        .overlay {
              if let collection = editingCollection {
                  recordForm(collection)
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .background(.background)
                      .ignoresSafeArea()
                      .zIndex(10)
              }
          }
'''
          if old not in root:
              raise SystemExit("Current record-form presentation block not found")
          root_path.write_text(root.replace(old, new, 1))

          tests_path = Path("PocketKernelUITests/PocketKernelUITests.swift")
          tests = tests_path.read_text()
          old = '''            XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.waitForExistence(timeout: 12), name)
              tap(app.buttons["Done"], timeout: 5)
'''
          new = '''            let done = app.buttons["Done"]
              XCTAssertTrue(done.waitForExistence(timeout: 15), name)
              XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.exists, name)
              tap(done)
'''
          if old not in tests:
              raise SystemExit("Current built-in runtime assertion block not found")
          tests_path.write_text(tests.replace(old, new, 1))

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-apply-final-ui-fix.yml
          git add PocketKernel/Shell/RootTabView.swift PocketKernelUITests/PocketKernelUITests.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: render record forms in-tree and await runtime opening [skip ci]"
          git push origin HEAD:pocketkernel-1.0-full-rebuild
