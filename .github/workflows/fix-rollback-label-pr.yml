name: Fix PocketKernel Rollback Call

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-rollback-label-pr.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 1
      - name: Fix rollback argument label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PocketKernel/App/AppEnvironment.swift")
          source = path.read_text()
          old = "try await store.rollbackManifest(id)"
          new = "try await store.rollbackManifest(id: id)"
          if old not in source:
              raise SystemExit("Expected rollback call was not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PocketKernel/App/AppEnvironment.swift
          git commit -m "Fix rollback manifest argument label"
          git push origin HEAD:pocketkernel-1.0-full-rebuild
