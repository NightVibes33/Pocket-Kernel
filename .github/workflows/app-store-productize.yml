name: Apply App Store Productization

on:
  push:
    branches: [main]
    paths: [.bootstrap/productize-trigger]

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/app-store-ready
          fetch-depth: 0

      - name: Reconstruct verified product bundle
        run: |
          set -euo pipefail
          cat .bootstrap/productization.part* | base64 -D > /tmp/productization.tar.gz
          echo '19e68c14b7bc8a6b3b8279d340abff6ae537923c5a6181898491a183f8cd46cd  /tmp/productization.tar.gz' | shasum -a 256 -c -
          rm -rf /tmp/productization
          mkdir -p /tmp/productization
          tar -xzf /tmp/productization.tar.gz -C /tmp/productization

      - name: Install consumer product
        run: |
          set -euo pipefail
          root=/tmp/productization
          cp "$root/PocketKernel/Core/SharedModels.swift" PocketKernel/Core/SharedModels.swift
          cp "$root/PocketKernel/Core/BackendClient.swift" PocketKernel/Core/BackendClient.swift
          cp "$root/PocketKernel/Agent/ChatAgent.swift" PocketKernel/Agent/ChatAgent.swift
          cp "$root/PocketKernel/UI/Views.swift" PocketKernel/UI/Views.swift
          cp "$root/PocketKernel/Info.plist" PocketKernel/Info.plist
          cp "$root/PocketKernel/PrivacyInfo.xcprivacy" PocketKernel/PrivacyInfo.xcprivacy
          mkdir -p api/account api/automations public AppStore
          cp "$root/api/account/delete.js" api/account/delete.js
          cp "$root/api/automations/[id].js" 'api/automations/[id].js'
          cp "$root/public/"*.html public/
          cp "$root/AppStore/metadata.md" AppStore/metadata.md
          cp "$root/APPSTORE_PRODUCTIZATION.md" APPSTORE_PRODUCTIZATION.md
          cp "$root/Scripts_build_unsigned_ipa.sh" Scripts/build_unsigned_ipa.sh
          cp "$root/Scripts_validate_ipa.sh" Scripts/validate_ipa.sh
          chmod +x Scripts/build_unsigned_ipa.sh Scripts/validate_ipa.sh

      - name: Register privacy manifest and release version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PocketKernel.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = s.replace('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = 2;')
          s = s.replace('MARKETING_VERSION = 2.0.0;', 'MARKETING_VERSION = 2.1.0;')
          if 'PrivacyInfo.xcprivacy in Resources' not in s:
              s = s.replace('\t\tA10000000000000000000111 /* PocketKernelApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000110 /* PocketKernelApp.swift */; };', '\t\tA10000000000000000000111 /* PocketKernelApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000110 /* PocketKernelApp.swift */; };\n\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000112 /* PrivacyInfo.xcprivacy */; };')
              s = s.replace('\t\tA10000000000000000000110 /* PocketKernelApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App/PocketKernelApp.swift; sourceTree = "<group>"; };', '\t\tA10000000000000000000110 /* PocketKernelApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App/PocketKernelApp.swift; sourceTree = "<group>"; };\n\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */ = {isa = PBXFileReference; lastKnownFileType = text.xml; path = PrivacyInfo.xcprivacy; sourceTree = "<group>"; };')
              s = s.replace('\t\t\t\tA10000000000000000000110 /* PocketKernelApp.swift */,', '\t\t\t\tA10000000000000000000110 /* PocketKernelApp.swift */,\n\t\t\t\tA10000000000000000000112 /* PrivacyInfo.xcprivacy */,')
              s = s.replace('\t\tA1000000000000000000000B /* Resources */ = {\n\t\t\tisa = PBXResourcesBuildPhase;\n\t\t\tbuildActionMask = 2147483647;\n\t\t\tfiles = ();\n\t\t\trunOnlyForDeploymentPostprocessing = 0;\n\t\t};', '\t\tA1000000000000000000000B /* Resources */ = {\n\t\t\tisa = PBXResourcesBuildPhase;\n\t\t\tbuildActionMask = 2147483647;\n\t\t\tfiles = (\n\t\t\t\tA10000000000000000000113 /* PrivacyInfo.xcprivacy in Resources */,\n\t\t\t);\n\t\t\trunOnlyForDeploymentPostprocessing = 0;\n\t\t};')
          p.write_text(s)
          PY
          grep -q 'PrivacyInfo.xcprivacy in Resources' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.1.0' PocketKernel.xcodeproj/project.pbxproj

      - name: Validate product files
        run: |
          set -euo pipefail
          plutil -lint PocketKernel/Info.plist PocketKernel/PrivacyInfo.xcprivacy
          swiftc -parse PocketKernel/Core/SharedModels.swift PocketKernel/Core/BackendClient.swift PocketKernel/Agent/ChatAgent.swift PocketKernel/UI/Views.swift
          node --check api/account/delete.js
          node --check 'api/automations/[id].js'
          npm test
          node Scripts/validate_backend.mjs
          grep -q 'Delete my PocketKernel data' PocketKernel/UI/Views.swift
          grep -q 'StarterTemplate' PocketKernel/Core/SharedModels.swift
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' PocketKernel/PrivacyInfo.xcprivacy

      - name: Commit clean product branch
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/app-store-productize.yml
          git config user.name 'PocketKernel Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Productize PocketKernel 2.1 for App Store users'
          git push origin HEAD:product/app-store-ready
