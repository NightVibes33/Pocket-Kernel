name: Report PocketKernel Staging Verification

on:
  workflow_run:
    workflows: ["Build PocketKernel Unsigned IPA"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'pocketkernel-1.0-full-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0

      - name: Write verification report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p .github/verification
          rm -f .github/verification/PASSED.md .github/verification/FAILED.md
          if [ "$CONCLUSION" = success ]; then
            cat > .github/verification/PASSED.md <<EOF
          # PocketKernel staging verification passed

          - Run: $RUN_NUMBER ($RUN_ID)
          - Commit: $HEAD_SHA
          - Result: success
          - Gates: source, lint, templates, simulator tests, ARM64 device build, unsigned IPA validation
          EOF
          else
            gh run view "$RUN_ID" --repo NightVibes33/Pocket-Kernel --log-failed > /tmp/failed.log || true
            {
              echo '# PocketKernel staging verification failed'
              echo
              echo "- Run: $RUN_NUMBER ($RUN_ID)"
              echo "- Commit: $HEAD_SHA"
              echo "- Result: $CONCLUSION"
              echo
              echo '```text'
              grep -E '(^| )(error:|fatal error:|Testing failed:|Test Case.*failed|FAILURE|failed)' /tmp/failed.log | tail -n 300 || tail -n 300 /tmp/failed.log
              echo '```'
            } > .github/verification/FAILED.md
          fi

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/verification
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record PocketKernel staging verification result'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
