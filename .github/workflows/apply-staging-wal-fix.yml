name: Restore staging WAL migration

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Restore WAL pragma
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernel/Persistence/PocketStore.swift')
          source = path.read_text()
          needle = '        try raw("PRAGMA foreign_keys=ON")\n'
          replacement = '        try raw("PRAGMA journal_mode=WAL")\n        try raw("PRAGMA foreign_keys=ON")\n'
          if 'PRAGMA journal_mode=WAL' not in source:
              if needle not in source:
                  raise SystemExit('Foreign key pragma was not found')
              source = source.replace(needle, replacement, 1)
          path.write_text(source)
          PY
          rm .github/workflows/apply-staging-wal-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Persistence/PocketStore.swift .github/workflows/apply-staging-wal-fix.yml
          git commit -m 'Restore SQLite WAL migration pragma'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
