name: Apply Complete PocketKernel FVP Batch

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Replace staging tree atomically
        shell: bash
        env:
          PAYLOAD_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 --decode > /tmp/pocketkernel-fvp.tar.gz
          tar -xzf /tmp/pocketkernel-fvp.tar.gz -C .
          rm -rf \
            .bootstrap \
            .staging-tree-test \
            .github/STAGING_FVP_BATCH_PLAN.md \
            .github/STAGING_FVP_VERIFICATION.md \
            .github/workflows/export-staging-source.yml \
            .github/workflows/apply-full-fvp-batch.yml
          chmod +x Scripts/*.sh Scripts/*.py
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --config .swiftformat
          Scripts/scan_source.sh
          Scripts/validate_templates.py PocketKernel/Templates
          swiftlint lint --strict --config .swiftlint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete generic PocketKernel 1.0 FVP source and tests'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
      - name: Dispatch full Xcode verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          gh workflow run build-unsigned.yml \
            --repo NightVibes33/Pocket-Kernel \
            --ref pocketkernel-1.0-full-rebuild \
            -f publish_release=false
