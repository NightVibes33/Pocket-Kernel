name: Fix active login router

on:
  push:
    branches: [product/app-store-ready]
    paths:
      - .github/workflows/fix-active-login-router.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/app-store-ready
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove active login gate and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('PocketKernel/App/PocketKernelApp.swift')
          text = app_path.read_text()

          start = text.index('struct NovaEntryView: View {')
          end = text.index('\nstruct NovaBootView: View {', start)

          replacement = '''struct NovaEntryView: View {
              @AppStorage("didCompleteOnboarding.v3") private var didCompleteOnboarding = false
              @State private var phase: Phase = .launch
              @Environment(\\.accessibilityReduceMotion) private var reduceMotion

              private enum Phase {
                  case launch
                  case ready
              }

              var body: some View {
                  ZStack {
                      switch phase {
                      case .launch:
                          NovaBootView()
                              .transition(.opacity.combined(with: .scale(scale: 1.03)))
                      case .ready:
                          if !didCompleteOnboarding {
                              NovaOnboardingView { didCompleteOnboarding = true }
                                  .transition(.opacity.combined(with: .move(edge: .trailing)))
                          } else {
                              NovaRootView()
                                  .transition(.opacity)
                          }
                      }
                  }
                  .background(NovaPalette.ink)
                  .animation(reduceMotion ? .linear(duration: 0.16) : .easeInOut(duration: 0.52), value: phase)
                  .task {
                      try? await Task.sleep(for: .milliseconds(reduceMotion ? 180 : 880))
                      withAnimation(reduceMotion ? .linear(duration: 0.16) : .easeInOut(duration: 0.52)) {
                          phase = .ready
                      }
                  }
              }
          }
          '''

          text = text[:start] + replacement + text[end:]
          app_path.write_text(text)

          project_path = Path('PocketKernel.xcodeproj/project.pbxproj')
          project = project_path.read_text()
          if project.count('CURRENT_PROJECT_VERSION = 3;') != 2:
              raise SystemExit('Unexpected CURRENT_PROJECT_VERSION occurrences')
          if project.count('MARKETING_VERSION = 2.2.0;') != 2:
              raise SystemExit('Unexpected MARKETING_VERSION occurrences')
          project = project.replace('CURRENT_PROJECT_VERSION = 3;', 'CURRENT_PROJECT_VERSION = 67;')
          project = project.replace('MARKETING_VERSION = 2.2.0;', 'MARKETING_VERSION = 2.2.1;')
          project_path.write_text(project)

          active = app_path.read_text()[start:app_path.read_text().index('\nstruct NovaBootView: View {', start)]
          forbidden = ['NovaAccountGatewayView()', 'account.restore()', 'account.isSignedIn']
          for value in forbidden:
              if value in active:
                  raise SystemExit(f'Active launch router still contains {value}')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-active-login-router.yml

      - name: Commit corrected router
        run: |
          git config user.name "PocketKernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add PocketKernel/App/PocketKernelApp.swift PocketKernel.xcodeproj/project.pbxproj .github/workflows/fix-active-login-router.yml
          git commit -m "fix: bypass active Nova login gate and bump to 2.2.1 (67)"
          git push origin HEAD:product/app-store-ready
