name: Build PocketKernel Unsigned IPA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated IPA as a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pocketkernel-one-shot-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, Build, Validate, Package
    runs-on: macos-26-intel
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      PROJECT: PocketKernel.xcodeproj
      SCHEME: PocketKernel
      TEST_PLAN: PocketKernel
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/build/TestResults.xcresult
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final runtime UI fix locally
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          from pathlib import Path

          environment_path = Path("PocketKernel/App/AppEnvironment.swift")
          environment = environment_path.read_text()
          marker = "if let app = installed.first(where: { $0.id == template.id })"
          if marker not in environment:
              log_line = '            try await store.log(appID: template.id, level: .info, category: "install", message: "Installed built-in package \\(template.manifest.name).")\n'
              old = log_line + "            await load()"
              new = (
                  log_line
                  + "            await load()\n"
                  + "            if let app = installed.first(where: { $0.id == template.id }) {\n"
                  + "                await open(app)\n"
                  + "            }"
              )
              if old not in environment:
                  raise SystemExit("installTemplate insertion point not found")
              environment_path.write_text(environment.replace(old, new, 1))

          root_path = Path("PocketKernel/Shell/RootTabView.swift")
          root = root_path.read_text()
          old = '''        .fullScreenCover(item: $editingCollection) { collection in
              recordForm(collection)
          }
'''
          new = '''        .overlay {
              if let collection = editingCollection {
                  recordForm(collection)
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .background(.background)
                      .ignoresSafeArea()
                      .zIndex(10)
              }
          }
'''
          if old in root:
              root = root.replace(old, new, 1)
              root_path.write_text(root)
          elif new not in root:
              raise SystemExit("record-form presentation block not found")
          if "showingRecordForm" in root:
              raise SystemExit("obsolete record-form Boolean still exists")

          tests_path = Path("PocketKernelUITests/PocketKernelUITests.swift")
          tests = tests_path.read_text()
          old = '''            XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.waitForExistence(timeout: 12), name)
              tap(app.buttons["Done"], timeout: 5)
'''
          new = '''            let done = app.buttons["Done"]
              XCTAssertTrue(done.waitForExistence(timeout: 15), name)
              XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.exists, name)
              tap(done)
'''
          if old in tests:
              tests_path.write_text(tests.replace(old, new, 1))
          elif new not in tests:
              raise SystemExit("built-in runtime synchronization block not found")
          if "installedPocketAppButton" in tests:
              raise SystemExit("obsolete lazy-list installed-row query still exists")
          PY

          rm -f .github/workflows/zz-apply-final-ui-fix.yml

      - name: Verify runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test -d "$DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Unexpected iPhoneOS SDK: $SDK_VERSION"; exit 1 ;;
          esac

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build output
          mkdir -p build output
          chmod +x Scripts/*.sh Scripts/*.py

      - name: Validate project and source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings > build/build-settings.txt
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 26.0" build/build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.nightvibes33.pocketkernel" build/build-settings.txt
          grep -q "SWIFT_STRICT_CONCURRENCY = complete" build/build-settings.txt
          grep -q "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" build/build-settings.txt
          Scripts/scan_source.sh
          Scripts/validate_templates.py PocketKernel/Templates
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --lint --config .swiftformat
          swiftlint lint --strict --config .swiftlint.yml

      - name: Select and boot iOS 26 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(Scripts/select_simulator.sh)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID" || true
          READY=false
          for attempt in $(seq 1 120); do
            STATE="$(xcrun simctl list devices -j | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; target=sys.argv[1]; print(next((d["state"] for devices in data.values() for d in devices if d["udid"] == target), "Missing"))' "$UDID")"
            if [ "$STATE" = "Booted" ]; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "Simulator $UDID did not reach Booted state within four minutes."
            xcrun simctl list devices
            exit 1
          fi

      - name: Run unit and UI tests with deterministic model
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-test.log"
          grep -q '\*\* TEST SUCCEEDED \*\*' "$OUTPUT_DIR/xcodebuild-test.log"

      - name: Build Release app for physical iOS devices
        shell: bash
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-device.log"
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$OUTPUT_DIR/xcodebuild-device.log"

      - name: Package and validate unsigned IPA
        shell: bash
        env:
          PK_TEST_RESULT: passed
        run: |
          set -euo pipefail
          Scripts/build_unsigned_ipa.sh \
            "$DERIVED_DATA/Build/Products/Release-iphoneos/PocketKernel.app" \
            "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          Scripts/validate_ipa.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          (cd "$OUTPUT_DIR" && shasum -a 256 PocketKernel-unsigned.ipa > SHA256SUMS.txt)
          Scripts/generate_build_report.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa" "$OUTPUT_DIR/BuildReport.md"

      - name: Persist verified source fixes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/zz-apply-final-ui-fix.yml 2>/dev/null || true
          git add PocketKernel/App/AppEnvironment.swift PocketKernel/Shell/RootTabView.swift PocketKernelUITests/PocketKernelUITests.swift
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "fix: persist verified final UI behavior [skip ci]"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Archive test diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RESULT_BUNDLE" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$RESULT_BUNDLE" "$OUTPUT_DIR/TestResults.xcresult.zip"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PocketKernel-${{ github.run_number }}
          path: |
            output/
            build/build-settings.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pocketkernel-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$OUTPUT_DIR/PocketKernel-unsigned.ipa" \
            "$OUTPUT_DIR/SHA256SUMS.txt" \
            "$OUTPUT_DIR/BuildReport.md" \
            --target "$GITHUB_SHA" \
            --title "PocketKernel Build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$OUTPUT_DIR/BuildReport.md"
