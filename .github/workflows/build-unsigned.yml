name: Build PocketKernel Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated IPA as a GitHub release
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: pocketkernel-one-shot-build
  cancel-in-progress: true
jobs:
  build:
    name: Test, Build, Validate, Package
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      PROJECT: PocketKernel.xcodeproj
      SCHEME: PocketKernel
      TEST_PLAN: PocketKernel
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/build/TestResults.xcresult
      OUTPUT_DIR: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Prepare directories
        run: |
          set -euo pipefail
          rm -rf build output
          mkdir -p build output
      - name: Verify runner and Xcode
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version; swift --version
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 26.* ]]
      - name: Prepare and inspect
        run: |
          set -euo pipefail
          chmod +x Scripts/*.sh Scripts/*.py
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings > build/build-settings.txt
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 26.0' build/build-settings.txt
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.nightvibes33.pocketkernel' build/build-settings.txt
          Scripts/scan_source.sh
          Scripts/validate_templates.py PocketKernel/Templates
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --lint
          swiftlint lint --strict --config .swiftlint.yml
      - name: Select simulator
        id: simulator
        run: |
          udid="$(Scripts/select_simulator.sh)"; echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true; xcrun simctl bootstatus "$udid" -b
      - name: Run tests with deterministic model
        run: |
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -testPlan "$TEST_PLAN" -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULT_BUNDLE" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build ARM64 device app
        run: |
          xcodebuild clean build -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''
      - name: Package and validate unsigned IPA
        run: |
          Scripts/build_unsigned_ipa.sh "$DERIVED_DATA/Build/Products/Release-iphoneos/PocketKernel.app" "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          Scripts/validate_ipa.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          (cd "$OUTPUT_DIR" && shasum -a 256 PocketKernel-unsigned.ipa > SHA256SUMS.txt)
          Scripts/generate_build_report.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa" "$OUTPUT_DIR/BuildReport.md"
      - name: Archive diagnostics
        if: always()
        run: |
          if [ -d "$RESULT_BUNDLE" ]; then ditto -c -k --sequesterRsrc --keepParent "$RESULT_BUNDLE" "$OUTPUT_DIR/TestResults.xcresult.zip"; fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PocketKernel-${{ github.run_number }}
          path: |
            output/
            build/build-settings.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        if: success() && (github.event_name == 'push' || inputs.publish_release)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tag="pocketkernel-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$OUTPUT_DIR/PocketKernel-unsigned.ipa" "$OUTPUT_DIR/SHA256SUMS.txt" "$OUTPUT_DIR/BuildReport.md" --target "$GITHUB_SHA" --title "PocketKernel Build ${GITHUB_RUN_NUMBER}" --notes-file "$OUTPUT_DIR/BuildReport.md"
