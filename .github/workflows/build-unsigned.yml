name: Apply Pending PocketKernel Source Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pocketkernel-source-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Commit comparator fix and undo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Patch staging source only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BRANCH: pocketkernel-1.0-full-rebuild
        run: |
          set -euo pipefail
          git fetch origin "$STAGING_BRANCH"
          git checkout -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('PocketKernel/Runtime/RuntimeEngine.swift')
          source = runtime.read_text()
          replacements = {
              'case (.number(let left), .number(let right)): left == right ? 0 : left < right ? -1 : 1':
                  'case (.number(let left), .number(let right)): return left == right ? 0 : left < right ? -1 : 1',
              'case (.date(let left), .date(let right)): left == right ? 0 : left < right ? -1 : 1':
                  'case (.date(let left), .date(let right)): return left == right ? 0 : left < right ? -1 : 1',
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
          runtime.write_text(source)

          tests = Path('PocketKernelTests/PocketKernelTests.swift')
          source = tests.read_text()
          if 'func testSessionUndoRestoresStateAndRecords()' not in source:
              anchor = '    func testPhotoConditionsCyclesCancellationAndNetworkBoundaries() async throws {\n'
              if anchor not in source:
                  raise SystemExit('Runtime test insertion anchor not found')
              test = '''    func testSessionUndoRestoresStateAndRecords() async throws {
                  let store = try PocketStore(inMemory: true)
                  var package = try bundledPackage(named: "Inventory List")
                  try await store.install(package)
                  package.manifest.actions += [
                      .init(id: "set-filter", kind: .setValue, target: "state.filter", value: .string("active")),
                      .init(id: "delete-item-for-undo", kind: .deleteRecord, target: "items")
                  ]
                  let executor = ActionExecutor(store: store, intelligence: MockIntelligenceService())

                  _ = try await executor.execute("set-filter", manifest: package.manifest, context: [:])
                  let activeFilter = try await store.runtimeValue(appID: package.manifest.id, key: "filter")
                  XCTAssertEqual(activeFilter, .string("active"))
                  let canUndoState = await executor.canUndo()
                  XCTAssertTrue(canUndoState)

                  _ = try await executor.undoLast()
                  let clearedFilter = try await store.runtimeValue(appID: package.manifest.id, key: "filter")
                  XCTAssertNil(clearedFilter)

                  let create = try XCTUnwrap(package.manifest.actions.first { $0.kind == .createRecord })
                  guard case .record(let record) = try await executor.execute(
                      create.id,
                      manifest: package.manifest,
                      context: ["form": .object(["name": .string("Undo Item"), "quantity": .number(1)])]
                  ) else { return XCTFail("Expected created record") }

                  _ = try await executor.execute(
                      "delete-item-for-undo",
                      manifest: package.manifest,
                      context: ["selectedRecordID": .string(record.id.uuidString)]
                  )
                  let deletedRecords = try await store.records(appID: package.manifest.id, collectionID: "items")
                  XCTAssertTrue(deletedRecords.isEmpty)

                  _ = try await executor.undoLast()
                  let restoredRecords = try await store.records(appID: package.manifest.id, collectionID: "items")
                  XCTAssertEqual(restoredRecords, [record])
              }

          '''
              source = source.replace(anchor, test + anchor, 1)
          tests.write_text(source)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Runtime/RuntimeEngine.swift PocketKernelTests/PocketKernelTests.swift
          git commit -m 'Fix runtime comparison and verify session undo'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$STAGING_BRANCH"
