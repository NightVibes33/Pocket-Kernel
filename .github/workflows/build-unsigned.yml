name: Build PocketKernel Unsigned IPA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated IPA as a GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pocketkernel-one-shot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Build, Validate, Package
    runs-on: macos-26-intel
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      PROJECT: PocketKernel.xcodeproj
      SCHEME: PocketKernel
      TEST_PLAN: PocketKernel
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/build/TestResults.xcresult
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Persist final runtime state flow
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          from pathlib import Path

          root_path = Path("PocketKernel/Shell/RootTabView.swift")
          root = root_path.read_text()

          library_old = "\n".join([
              "                        Button {",
              "                            Task {",
              "                                await environment.installTemplate(template)",
              "                                if let app = environment.installed.first(where: { $0.id == template.id }) {",
              "                                    await environment.open(app)",
              "                                }",
              "                            }",
              "                        } label: {",
          ]) + "\n"
          library_new = "\n".join([
              "                        Button { Task { await environment.installTemplate(template) } } label: {",
          ]) + "\n"
          if library_old in root:
              root = root.replace(library_old, library_new, 1)
          elif library_new not in root:
              raise SystemExit("single-owner built-in install block not found")

          body_old = "\n".join([
              "    var body: some View {",
              "        List {",
              "            if manifest.screens.count > 1 {",
              "                Picker(\"Screen\", selection: $selectedScreenID) { ForEach(manifest.screens) { Text($0.title).tag($0.id) } }.pickerStyle(.segmented)",
              "            }",
              "            if let screen {",
              "                ForEach(screen.components) { component in",
              "                    ComponentRenderer(",
              "                        component: component,",
              "                        recordsByCollection: recordsByCollection,",
              "                        collectionSpecs: collectionSpecs,",
              "                        assetData: assetData,",
              "                        runtimeValues: $runtimeValues,",
              "                        runAction: runAction,",
              "                        importFile: { importing = true },",
              "                        exportFile: prepareExport",
              "                    )",
              "                }",
              "            } else {",
              "                ContentUnavailableView(\"Invalid Screen\", systemImage: \"exclamationmark.triangle\", description: Text(\"The entry screen is missing.\"))",
              "            }",
              "        }",
              "        .navigationTitle(screen?.title ?? manifest.name)",
              "        .toolbar {",
              "            if !previewOnly {",
              "                ToolbarItemGroup(placement: .topBarTrailing) {",
              "                    Button { undoLast() } label: { Label(\"Undo\", systemImage: \"arrow.uturn.backward\") }",
              "                        .disabled(!canUndo)",
              "                    Button(\"Done\") { environment.lifecycle.markRuntimeClosed(); dismiss() }",
              "                }",
              "            }",
              "        }",
              "        .task { await startRuntime() }",
              "        .onDisappear { if !previewOnly { environment.lifecycle.markRuntimeClosed() } }",
              "        .onChange(of: runtimeValues) { _, values in persist(values) }",
              "        .overlay {",
              "            if let collection = editingCollection {",
              "                recordForm(collection)",
              "                    .frame(maxWidth: .infinity, maxHeight: .infinity)",
              "                    .background(.background)",
              "                    .ignoresSafeArea()",
              "                    .zIndex(1)",
              "            }",
              "        }",
          ]) + "\n"
          body_new = "\n".join([
              "    var body: some View {",
              "        Group {",
              "            if let collection = editingCollection {",
              "                recordForm(collection)",
              "            } else {",
              "                runtimeContent",
              "            }",
              "        }",
              "        .task { await startRuntime() }",
              "        .onDisappear { if !previewOnly { environment.lifecycle.markRuntimeClosed() } }",
              "        .onChange(of: runtimeValues) { _, values in persist(values) }",
          ]) + "\n"
          if body_old in root:
              root = root.replace(body_old, body_new, 1)
          elif body_new not in root:
              raise SystemExit("RuntimeView body block not found")

          permission_marker = "    @ViewBuilder private var permissionButtons: some View {\n"
          runtime_content = "\n".join([
              "    private var runtimeContent: some View {",
              "        List {",
              "            if manifest.screens.count > 1 {",
              "                Picker(\"Screen\", selection: $selectedScreenID) { ForEach(manifest.screens) { Text($0.title).tag($0.id) } }.pickerStyle(.segmented)",
              "            }",
              "            if let screen {",
              "                ForEach(screen.components) { component in",
              "                    ComponentRenderer(",
              "                        component: component,",
              "                        recordsByCollection: recordsByCollection,",
              "                        collectionSpecs: collectionSpecs,",
              "                        assetData: assetData,",
              "                        runtimeValues: $runtimeValues,",
              "                        runAction: runAction,",
              "                        importFile: { importing = true },",
              "                        exportFile: prepareExport",
              "                    )",
              "                }",
              "            } else {",
              "                ContentUnavailableView(\"Invalid Screen\", systemImage: \"exclamationmark.triangle\", description: Text(\"The entry screen is missing.\"))",
              "            }",
              "        }",
              "        .navigationTitle(screen?.title ?? manifest.name)",
              "        .toolbar {",
              "            if !previewOnly {",
              "                ToolbarItemGroup(placement: .topBarTrailing) {",
              "                    Button { undoLast() } label: { Label(\"Undo\", systemImage: \"arrow.uturn.backward\") }",
              "                        .disabled(!canUndo)",
              "                    Button(\"Done\") { environment.lifecycle.markRuntimeClosed(); dismiss() }",
              "                }",
              "            }",
              "        }",
              "    }",
              "",
          ]) + "\n"
          if "    private var runtimeContent: some View {" not in root:
              if permission_marker not in root:
                  raise SystemExit("runtimeContent insertion point not found")
              root = root.replace(permission_marker, runtime_content + permission_marker, 1)

          form_old = "\n".join([
              "    private func recordForm(_ collection: CollectionSpec) -> some View {",
              "        NavigationStack {",
              "            Form { ForEach(collection.fields) { field in fieldEditor(field) } }",
              "                .navigationTitle(\"Add \\(collection.title)\")",
              "                .toolbar {",
              "                    ToolbarItem(placement: .cancellationAction) {",
              "                        Button(\"Cancel\") { editingCollection = nil }",
              "                    }",
              "                    ToolbarItem(placement: .confirmationAction) {",
              "                        Button(\"Save\") {",
              "                            if let action = manifest.actions.first(where: { $0.kind == .createRecord && $0.target == collection.id }) {",
              "                                editingCollection = nil",
              "                                execute(action.id, form: formValues)",
              "                            }",
              "                        }",
              "                    }",
              "                }",
              "        }",
              "    }",
          ]) + "\n"
          form_new = "\n".join([
              "    private func recordForm(_ collection: CollectionSpec) -> some View {",
              "        Form { ForEach(collection.fields) { field in fieldEditor(field) } }",
              "            .navigationTitle(\"Add \\(collection.title)\")",
              "            .toolbar {",
              "                ToolbarItem(placement: .cancellationAction) {",
              "                    Button(\"Cancel\") { editingCollection = nil }",
              "                }",
              "                ToolbarItem(placement: .confirmationAction) {",
              "                    Button(\"Save\") {",
              "                        if let action = manifest.actions.first(where: { $0.kind == .createRecord && $0.target == collection.id }) {",
              "                            editingCollection = nil",
              "                            execute(action.id, form: formValues)",
              "                        }",
              "                    }",
              "                }",
              "            }",
              "    }",
          ]) + "\n"
          if form_old in root:
              root = root.replace(form_old, form_new, 1)
          elif form_new not in root:
              raise SystemExit("inline record form block not found")
          root_path.write_text(root)

          tests_path = Path("PocketKernelUITests/PocketKernelUITests.swift")
          tests = tests_path.read_text()
          test_old = "\n".join([
              "            tap(installButton, timeout: 10)",
              "            XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.waitForExistence(timeout: 12), name)",
              "            tap(app.buttons[\"Done\"], timeout: 5)",
          ]) + "\n"
          test_new = "\n".join([
              "            tap(installButton, timeout: 10)",
              "            let done = app.buttons[\"Done\"]",
              "            XCTAssertTrue(done.waitForExistence(timeout: 15), name)",
              "            XCTAssertTrue(app.staticTexts[expectedHeadings[name] ?? name].firstMatch.exists, name)",
              "            tap(done, timeout: 5)",
          ]) + "\n"
          if test_old in tests:
              tests_path.write_text(tests.replace(test_old, test_new, 1))
          elif test_new not in tests:
              raise SystemExit("built-in runtime wait block not found")
          PY

          git add PocketKernel/Shell/RootTabView.swift PocketKernelUITests/PocketKernelUITests.swift
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "fix: make runtime UI state single-owner [skip ci]"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Verify runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test -d "$DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Unexpected iPhoneOS SDK: $SDK_VERSION"; exit 1 ;;
          esac

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build output
          mkdir -p build output
          chmod +x Scripts/*.sh Scripts/*.py

      - name: Validate project and source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings > build/build-settings.txt
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 26.0" build/build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.nightvibes33.pocketkernel" build/build-settings.txt
          grep -q "SWIFT_STRICT_CONCURRENCY = complete" build/build-settings.txt
          grep -q "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" build/build-settings.txt
          Scripts/scan_source.sh
          Scripts/validate_templates.py PocketKernel/Templates
          swiftformat PocketKernel PocketKernelTests PocketKernelUITests --lint --config .swiftformat
          swiftlint lint --strict --config .swiftlint.yml

      - name: Select and boot iOS 26 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(Scripts/select_simulator.sh)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID" || true
          READY=false
          for attempt in $(seq 1 120); do
            STATE="$(xcrun simctl list devices -j | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; target=sys.argv[1]; print(next((d["state"] for devices in data.values() for d in devices if d["udid"] == target), "Missing"))' "$UDID")"
            if [ "$STATE" = "Booted" ]; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "Simulator $UDID did not reach Booted state within four minutes."
            xcrun simctl list devices
            exit 1
          fi

      - name: Run unit and UI tests with deterministic model
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-test.log"
          grep -q '\*\* TEST SUCCEEDED \*\*' "$OUTPUT_DIR/xcodebuild-test.log"

      - name: Build Release app for physical iOS devices
        shell: bash
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$OUTPUT_DIR/xcodebuild-device.log"
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$OUTPUT_DIR/xcodebuild-device.log"

      - name: Package and validate unsigned IPA
        shell: bash
        env:
          PK_TEST_RESULT: passed
        run: |
          set -euo pipefail
          Scripts/build_unsigned_ipa.sh \
            "$DERIVED_DATA/Build/Products/Release-iphoneos/PocketKernel.app" \
            "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          Scripts/validate_ipa.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa"
          (cd "$OUTPUT_DIR" && shasum -a 256 PocketKernel-unsigned.ipa > SHA256SUMS.txt)
          Scripts/generate_build_report.sh "$OUTPUT_DIR/PocketKernel-unsigned.ipa" "$OUTPUT_DIR/BuildReport.md"

      - name: Archive test diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RESULT_BUNDLE" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$RESULT_BUNDLE" "$OUTPUT_DIR/TestResults.xcresult.zip"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PocketKernel-${{ github.run_number }}
          path: |
            output/
            build/build-settings.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pocketkernel-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$OUTPUT_DIR/PocketKernel-unsigned.ipa" \
            "$OUTPUT_DIR/SHA256SUMS.txt" \
            "$OUTPUT_DIR/BuildReport.md" \
            --target "$GITHUB_SHA" \
            --title "PocketKernel Build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$OUTPUT_DIR/BuildReport.md"
