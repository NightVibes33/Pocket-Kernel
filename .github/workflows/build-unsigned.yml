name: Apply Nested Chart Assertion Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pocketkernel-chart-test-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Commit recursive chart assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Patch staging test source only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_BRANCH: pocketkernel-1.0-full-rebuild
        run: |
          set -euo pipefail
          git fetch origin "$STAGING_BRANCH"
          git checkout -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PocketKernelTests/PocketKernelTests.swift')
          source = path.read_text()
          old = '        XCTAssertTrue(manifest.screens.flatMap(\\.components).contains { $0.kind == .chart })\n'
          new = '''        func containsChart(_ components: [ComponentSpec]) -> Bool {
              components.contains { component in
                  component.kind == .chart || containsChart(component.children)
              }
          }
          XCTAssertTrue(manifest.screens.contains { containsChart($0.components) })
          '''
          if old not in source:
              raise SystemExit('Expected top-level chart assertion was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernelTests/PocketKernelTests.swift
          git commit -m 'Test nested generated chart components correctly'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$STAGING_BRANCH"
