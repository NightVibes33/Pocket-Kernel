name: Fix PocketKernel Source Formatting

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-source-format-pr.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 1
      - name: Remove consecutive blank line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("PocketKernelTests/PocketKernelTests.swift")
          source = path.read_text()
          needle = "}\n\n\nfinal class PromptBlueprintGeneratorTests"
          if needle not in source:
              raise SystemExit("Expected formatting issue was not found")
          path.write_text(source.replace(needle, "}\n\nfinal class PromptBlueprintGeneratorTests", 1))
          PY
      - name: Commit formatting fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PocketKernelTests/PocketKernelTests.swift
          git commit -m "Format prompt compiler tests"
          git push origin HEAD:pocketkernel-1.0-full-rebuild
