name: Apply Automation Product Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-automation-product.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'pocketkernel-1.0-full-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Apply product source
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/integrate_automation_product.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernelUITests/PocketKernelUITests.swift')
          text = path.read_text()
          text = text.replace(
              '''        let editor = app.textViews["Automation description"]
        tap(editor, timeout: 10)
        editor.typeText(prompt)
        tap(app.buttons["Build workflow"], timeout: 8)
''',
              '''        tap(app.buttons[prompt], timeout: 10)
        tap(app.buttons["Build workflow"], timeout: 8)
'''
          )
          path.write_text(text)
          PY
          grep -q 'FoundationAutomationGenerator.swift in Sources' PocketKernel.xcodeproj/project.pbxproj
          grep -q 'return switch trigger.kind' PocketKernel/Shell/RootTabView.swift
          grep -q 'testBuildReviewSaveAndPersistTypedWorkflow' PocketKernelUITests/PocketKernelUITests.swift
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PocketKernel PocketKernelTests PocketKernelUITests PocketKernel.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m 'Integrate Foundation automation generation and product tests'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
