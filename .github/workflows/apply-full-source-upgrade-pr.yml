name: Integrate PocketKernel Production Source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-full-source-upgrade-pr.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 1
      - name: Apply production source upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path("Scripts/apply_full_source_upgrade.py")
          source = script.read_text()
          workflow_start = source.index('\nworkflow = Path(".github/workflows/build-unsigned.yml")')
          cleanup_start = source.index('\nfor temporary in [', workflow_start)
          source = source[:workflow_start] + source[cleanup_start:]
          source = source.replace('    Path(".github/workflows/apply-full-source-upgrade.yml"),\n', '')
          source = source.replace('    Path(".github/workflows/apply-full-source-upgrade-pr.yml"),\n', '')
          script.write_text(source)
          PY
          python3 Scripts/apply_full_source_upgrade.py
      - name: Commit production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate runtime source and prompt compiler tests"
          git push origin HEAD:pocketkernel-1.0-full-rebuild
