name: Apply PocketKernel SQLite Verification Hooks

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Apply guarded PocketStore changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernel/Persistence/PocketStore.swift')
          source = path.read_text()

          replacements = [
              (
                  '    private let layout: PocketStorageLayout\n    private var database: OpaquePointer? { handle.pointer }',
                  '    private let layout: PocketStorageLayout\n    private let recordLimit: Int\n    private var database: OpaquePointer? { handle.pointer }'
              ),
              (
                  '    init(inMemory: Bool = false) throws {\n        layout = try PocketStorageLayout.make()',
                  '    init(inMemory: Bool = false, recordLimit: Int = PocketLimits.recordsPerCollection) throws {\n        layout = try PocketStorageLayout.make()\n        self.recordLimit = min(max(recordLimit, 1), PocketLimits.recordsPerCollection)'
              ),
              (
                  'guard sqlite3_step(count) == SQLITE_ROW, sqlite3_column_int(count, 0) < PocketLimits.recordsPerCollection else { throw StoreError.limit }',
                  'guard sqlite3_step(count) == SQLITE_ROW, sqlite3_column_int(count, 0) < recordLimit else { throw StoreError.limit }'
              )
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one PocketStore fragment: {old!r}')
              source = source.replace(old, new, 1)

          marker = '    private func package(id: UUID) throws -> PocketPackage {'
          if source.count(marker) != 1:
              raise SystemExit('Missing PocketStore testing-hook insertion marker')
          hooks = '''    #if DEBUG
    func databaseUserVersionForTesting() throws -> Int {
        var statement: OpaquePointer?
        try prepare("PRAGMA user_version", into: &statement)
        defer { sqlite3_finalize(statement) }
        guard sqlite3_step(statement) == SQLITE_ROW else { throw StoreError.query(lastError) }
        return Int(sqlite3_column_int(statement, 0))
    }

    func insertCorruptRecordForTesting(appID: UUID, collectionID: String) throws {
        try execute(
            "INSERT OR REPLACE INTO records(app_id,collection_id,record_id,payload,created_at,updated_at) VALUES(?,?,?,?,?,?)",
            bindings: [
                .text(appID.uuidString),
                .text(collectionID),
                .text(UUID().uuidString),
                .data(Data([0xFF, 0x00, 0xFE])),
                .double(Date().timeIntervalSince1970),
                .double(Date().timeIntervalSince1970)
            ]
        )
    }

    func insertRuntimeValueThenRollbackForTesting(appID: UUID, key: String) throws {
        try transaction {
            try execute(
                "INSERT OR REPLACE INTO runtime_values(app_id,key,value) VALUES(?,?,?)",
                bindings: [.text(appID.uuidString), .text(key), .data(try encoder.encode(PocketValue.string("rollback")))]
            )
            throw StoreError.invalidData
        }
    }
    #endif

'''
          source = source.replace(marker, hooks + marker, 1)
          path.write_text(source)
          PY

          rm .github/workflows/apply-store-testability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Persistence/PocketStore.swift .github/workflows/apply-store-testability.yml
          git commit -m 'Add bounded SQLite verification hooks'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
