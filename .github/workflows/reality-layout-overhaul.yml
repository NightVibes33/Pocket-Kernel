name: Reality layout overhaul

on:
  push:
    branches:
      - product/app-store-ready

permissions:
  contents: write

jobs:
  overhaul:
    if: ${{ !contains(github.event.head_commit.message, '[reality-layout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product/app-store-ready
          fetch-depth: 0

      - name: Replace marketing UI with real workspace
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          root = Path(".")
          ui = base64.b64decode(" ").decode("utf-8")
          entry = base64.b64decode("c3RydWN0IE5vdmFFbnRyeVZpZXc6IFZpZXcgewogICAgdmFyIGJvZHk6IHNvbWUgVmlldyB7CiAgICAgICAgUmVhbGl0eVJvb3RWaWV3KCkKICAgIH0KfQ==").decode("utf-8")
          templates = base64.b64decode("").decode("utf-8")

          ui_path = root / "PocketKernel/UI/RealityWorkspace.swift"
          ui_path.write_text(ui)

          app_path = root / "PocketKernel/App/PocketKernelApp.swift"
          app = app_path.read_text()
          replacement = entry + "\n\nstruct NovaBootView"
          app, count = re.subn(
              r"struct NovaEntryView: View \{.*?\n\}\n\nstruct NovaBootView",
              replacement,
              app,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not replace NovaEntryView")
          app_path.write_text(app)

          models_path = root / "PocketKernel/Core/SharedModels.swift"
          models = models_path.read_text()
          replacement = templates + "\n}"
          models, count = re.subn(
              r"    static let featured: \[StarterTemplate\] = \[.*?\n    \]\n\}",
              replacement,
              models,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not replace starter templates")
          models_path.write_text(models)

          chat_path = root / "PocketKernel/Agent/ChatAgent.swift"
          chat = chat_path.read_text().replace(
              'ChatMessage(role: .assistant, text: "What would you like to take off your plate?")',
              'ChatMessage(role: .assistant, text: "Describe an action. I’ll prepare the exact steps for your approval.")',
          )
          chat_path.write_text(chat)

          project_path = root / "PocketKernel.xcodeproj/project.pbxproj"
          project = project_path.read_text()
          build_id = "D40000000000000000000101"
          file_id = "D40000000000000000000100"

          if "RealityWorkspace.swift in Sources" not in project:
              project = project.replace(
                  "/* End PBXBuildFile section */",
                  f"\t\t{build_id} /* RealityWorkspace.swift in Sources */ = {isa = PBXBuildFile; fileRef = {file_id} /* RealityWorkspace.swift */; };\n/* End PBXBuildFile section */",
                  1,
              )
              project = project.replace(
                  "/* End PBXFileReference section */",
                  f"\t\t{file_id} /* RealityWorkspace.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = UI/RealityWorkspace.swift; sourceTree = \"<group>\"; };\n/* End PBXFileReference section */",
                  1,
              )
              project = project.replace(
                  "\t\t\t\tC30000000000000000000100 /* NovaSecondaryViews.swift */ ,",
                  "\t\t\t\tC30000000000000000000100 /* NovaSecondaryViews.swift */,\n"
                  f"\t\t\t\t{file_id} /* RealityWorkspace.swift */,",
                  1,
              )
              project = project.replace(
                  "\t\t\t\tC30000000000000000000101 /* NovaSecondaryViews.swift in Sources */,",
                  "\t\t\t\tC30000000000000000000101 /* NovaSecondaryViews.swift in Sources */,\n"
                  f"\t\t\t\t{build_id} /* RealityWorkspace.swift in Sources */,",
                  1,
              )

          project = re.sub(r"CURRENT_PROJECT_VERSION = \d+;", "CURRENT_PROJECT_VERSION = 70;", project)
          project = re.sub(r"MARKETING_VERSION = [^;]+;", "MARKETING_VERSION = 2.3.0;", project)
          project_path.write_text(project)

          helper = root / ".github/workflows/reality-layout-overhaul.yml"
          if helper.exists():
              helper.unlink()

          checks = {
              "entry routes to real workspace": "RealityRootView()" in app,
              "new UI file exists": ui_path.exists(),
              "project includes new UI": "RealityWorkspace.swift in Sources" in project,
              "fake Gmail starter removed": "Morning inbox brief" not in models,
              "real local starter exists": "Saved through Apple Reminders" in models,
              "version bumped": "MARKETING_VERSION = 2.3.0;" in project and "CURRENT_PROJECT_VERSION = 70;" in project,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))
          for name in checks:
              print("PASS:", name)
          PY

      - name: Commit overhaul
        shell: bash
        run: |
          git config user.name "PocketKernel CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: reality-first layout and remove fake UI [reality-layout]"
          git push origin HEAD:product/app-store-ready
