name: Format Nested Chart Test

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Format and commit the corrected test
        shell: bash
        run: |
          set -euo pipefail
          swiftformat PocketKernelTests/PocketKernelTests.swift --config .swiftformat
          if git diff --quiet -- PocketKernelTests/PocketKernelTests.swift; then
            echo 'Test file already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernelTests/PocketKernelTests.swift
          git commit -m 'Format nested chart regression assertion'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
