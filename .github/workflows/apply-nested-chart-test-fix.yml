name: Apply Nested Chart Test Fix

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Fix nested chart assertion and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PocketKernelTests/PocketKernelTests.swift')
          source = path.read_text()
          old = '''        XCTAssertTrue(manifest.screens.flatMap(\\.components).contains { $0.kind == .chart })
'''
          new = '''        func containsChart(_ components: [ComponentSpec]) -> Bool {
            components.contains { component in
                component.kind == .chart || containsChart(component.children)
            }
        }
        XCTAssertTrue(manifest.screens.contains { containsChart($0.components) })
'''
          if old not in source:
              raise SystemExit('Expected top-level chart assertion was not found')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/apply-nested-chart-test-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernelTests/PocketKernelTests.swift .github/workflows/apply-nested-chart-test-fix.yml
          git commit -m 'Test nested generated chart components correctly'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
