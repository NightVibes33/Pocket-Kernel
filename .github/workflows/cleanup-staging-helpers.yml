name: Cleanup PocketKernel staging helpers

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Remove temporary staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f \
            .staging-tree-test \
            .github/APPLY_WORKFLOW_FALLBACK_NOTE.md \
            .github/ATOMIC_TREE_PROBE.md \
            .github/ATOMIC_TREE_PROBE_2.md \
            .github/ATOMIC_TREE_PROBE_3.md \
            .github/ATOMIC_TREE_PROBE_4.md \
            .github/ATOMIC_TREE_PROBE_5.md \
            .github/ATOMIC_TREE_PROBE_6.md \
            .github/ATOMIC_TREE_PROBE_7.md \
            .github/STAGING_FVP_BATCH_PLAN.md \
            .github/workflows/apply-full-fvp-batch.yml \
            .github/workflows/export-staging-source.yml \
            .github/workflows/cleanup-staging-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary staging build machinery'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
