name: Apply staging actor fix

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Patch Swift 6 actor bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PocketKernel/Persistence/PocketStore.swift')
          source = path.read_text()
          old_call = '        try migrate()\n'
          new_call = '        try Self.migrate(handle.pointer)\n'
          old_decl = '    private func migrate() throws {\n'
          new_decl = '''    private static func migrate(_ database: OpaquePointer?) throws {
              func raw(_ sql: String) throws {
                  guard sqlite3_exec(database, sql, nil, nil, nil) == SQLITE_OK else {
                      let message = database.map { String(cString: sqlite3_errmsg($0)) } ?? "Unknown SQLite migration error"
                      throw StoreError.query(message)
                  }
              }
          '''
          if old_call not in source or old_decl not in source:
              raise SystemExit('Expected actor migration source was not found')
          source = source.replace(old_call, new_call, 1).replace(old_decl, new_decl, 1)
          path.write_text(source)
          PY
          rm .github/workflows/apply-staging-actor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Persistence/PocketStore.swift .github/workflows/apply-staging-actor-fix.yml
          git commit -m 'Fix Swift 6 actor database bootstrap'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
