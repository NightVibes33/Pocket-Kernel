name: Apply PocketKernel Persistence Verification Tests

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Apply guarded persistence test changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernelTests/PocketKernelTests.swift')
          source = path.read_text()

          old = '''    func testRecordLimitRejectsAdditionalWriteWithoutRemovingExistingRecords() async throws {
        let store = try PocketStore(inMemory: true)'''
          new = '''    func testRecordLimitRejectsAdditionalWriteWithoutRemovingExistingRecords() async throws {
        let store = try PocketStore(inMemory: true, recordLimit: 3)'''
          if source.count(old) != 1:
              raise SystemExit('Missing record-limit test store initialization')
          source = source.replace(old, new, 1)

          if source.count('for index in 0..<PocketLimits.recordsPerCollection {') != 1:
              raise SystemExit('Missing record-limit population loop')
          source = source.replace('for index in 0..<PocketLimits.recordsPerCollection {', 'for index in 0..<3 {', 1)

          if source.count('XCTAssertEqual(records.count, PocketLimits.recordsPerCollection)') != 1:
              raise SystemExit('Missing record-limit final assertion')
          source = source.replace('XCTAssertEqual(records.count, PocketLimits.recordsPerCollection)', 'XCTAssertEqual(records.count, 3)', 1)

          marker = '    func testDuplicateAppAndConcurrentActorWritesRemainConsistent() async throws {'
          if source.count(marker) != 1:
              raise SystemExit('Missing persistence-test insertion marker')
          test = '''    func testMigrationCorruptRowsAndTransactionsRollback() async throws {
        let store = try PocketStore(inMemory: true)
        let package = try bundledPackage(named: "Inventory List")
        try await store.install(package)

        let version = try await store.databaseUserVersionForTesting()
        XCTAssertEqual(version, 1)

        try await store.insertCorruptRecordForTesting(appID: package.manifest.id, collectionID: "items")
        let decodedRecords = try await store.records(appID: package.manifest.id, collectionID: "items")
        XCTAssertTrue(decodedRecords.isEmpty)

        await assertThrowsAsync {
            try await store.insertRuntimeValueThenRollbackForTesting(appID: package.manifest.id, key: "rollback-probe")
        } verify: { error in
            XCTAssertEqual(error as? StoreError, .invalidData)
        }
        let rolledBackValue = try await store.runtimeValue(appID: package.manifest.id, key: "rollback-probe")
        XCTAssertNil(rolledBackValue)
    }

'''
          source = source.replace(marker, test + marker, 1)
          path.write_text(source)
          PY

          rm .github/workflows/apply-persistence-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernelTests/PocketKernelTests.swift .github/workflows/apply-persistence-tests.yml
          git commit -m 'Verify migrations corruption rollback and record limits'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
