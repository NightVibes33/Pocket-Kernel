name: Apply Runtime Compare Return Fix

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Add missing compare returns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PocketKernel/Runtime/RuntimeEngine.swift')
          source = path.read_text()
          replacements = {
              '        case (.number(let left), .number(let right)): left == right ? 0 : left < right ? -1 : 1\n':
                  '        case (.number(let left), .number(let right)): return left == right ? 0 : left < right ? -1 : 1\n',
              '        case (.date(let left), .date(let right)): left == right ? 0 : left < right ? -1 : 1\n':
                  '        case (.date(let left), .date(let right)): return left == right ? 0 : left < right ? -1 : 1\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match: {old.strip()}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          Path('.github/workflows/apply-runtime-compare-return-fix.yml').unlink()
          PY
          swiftformat PocketKernel/Runtime/RuntimeEngine.swift --config .swiftformat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernel/Runtime/RuntimeEngine.swift .github/workflows/apply-runtime-compare-return-fix.yml
          git commit -m 'Fix runtime comparison return values'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
