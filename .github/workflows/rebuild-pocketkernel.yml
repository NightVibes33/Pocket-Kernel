name: Rebuild PocketKernel 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketkernel-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect staged replacement
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bootstrap/chunk-07 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PocketKernel has already been rebuilt."
          fi

      - name: Reconstruct and verify source archive
        if: steps.archive.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > /tmp/pocketkernel.tar.gz.b64
          base64 --decode /tmp/pocketkernel.tar.gz.b64 > /tmp/pocketkernel.tar.gz
          echo "fc8b144d3c39b3664b6fdf829cdc7ca85fd8316331cd5afc52ff8028d3549901  /tmp/pocketkernel.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/pocketkernel-new
          tar -xzf /tmp/pocketkernel.tar.gz -C /tmp/pocketkernel-new
          test -f /tmp/pocketkernel-new/PocketKernel/PocketKernelApp.swift
          test -f /tmp/pocketkernel-new/api/health.js
          test -f /tmp/pocketkernel-new/vercel.json
          test -f /tmp/pocketkernel-new/package.json

      - name: Replace legacy repository tree
        if: steps.archive.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pocketkernel-new/. .
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Rebuild PocketKernel as iOS 27 chat automation platform"
          git push origin HEAD:main
