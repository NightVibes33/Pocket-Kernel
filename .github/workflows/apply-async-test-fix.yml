name: Apply async XCTest assertion fix

on:
  push:
    branches: [pocketkernel-1.0-full-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pocketkernel-1.0-full-rebuild
          fetch-depth: 0
      - name: Fix async XCTest assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PocketKernelTests/PocketKernelTests.swift')
          source = path.read_text()
          replacements = {
              '        XCTAssertEqual(try await store.installedApps().count, 1)\n': '        let installedCount = try await store.installedApps().count\n        XCTAssertEqual(installedCount, 1)\n',
              '        XCTAssertEqual(try await store.records(appID: manifest.id, collectionID: "services"), [record])\n': '        let serviceRecords = try await store.records(appID: manifest.id, collectionID: "services")\n        XCTAssertEqual(serviceRecords, [record])\n',
              '        XCTAssertEqual(try await store.runtimeValue(appID: manifest.id, key: "search"), .string("query"))\n': '        let runtimeValue = try await store.runtimeValue(appID: manifest.id, key: "search")\n        XCTAssertEqual(runtimeValue, .string("query"))\n',
              '        XCTAssertEqual(try await store.permission(appID: manifest.id, capability: .localNotifications), .alwaysAllow)\n': '        let permission = try await store.permission(appID: manifest.id, capability: .localNotifications)\n        XCTAssertEqual(permission, .alwaysAllow)\n',
              '        XCTAssertTrue(try await store.installedApps().isEmpty)\n': '        let installedAfterDelete = try await store.installedApps()\n        XCTAssertTrue(installedAfterDelete.isEmpty)\n',
              '        XCTAssertTrue(try await store.records(appID: manifest.id, collectionID: "services").isEmpty)\n': '        let recordsAfterDelete = try await store.records(appID: manifest.id, collectionID: "services")\n        XCTAssertTrue(recordsAfterDelete.isEmpty)\n',
              '        XCTAssertEqual(try await store.records(appID: manifest.id, collectionID: "items").count, 40)\n': '        let itemCount = try await store.records(appID: manifest.id, collectionID: "items").count\n        XCTAssertEqual(itemCount, 40)\n',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing expected test expression: {old.strip()}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          rm .github/workflows/apply-async-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PocketKernelTests/PocketKernelTests.swift .github/workflows/apply-async-test-fix.yml
          git commit -m 'Fix Swift 6 async XCTest assertions'
          git push origin HEAD:pocketkernel-1.0-full-rebuild
